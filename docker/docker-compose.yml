version: '3.8'

services:
  backend:
    build:
      context: ../backend  
      dockerfile: Dockerfile
    container_name: ai-learning-backend
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development